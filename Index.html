<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portal Presensi Murid - SMKN 1 Klaten</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <!-- Library Face Detection -->
  <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
  <style>
    body { background-color: #f0f2f5; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    .header-bar { background: #1a2332; color: white; padding: 15px 30px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .camera-box { border-radius: 12px; overflow: hidden; background: #000; position: relative; border: 4px solid #fff; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
    video { width: 100%; height: auto; transform: scaleX(-1); }
    #faceOverlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 5; pointer-events: none; transform: scaleX(-1); }
    .input-barcode { font-size: 2rem; font-weight: bold; text-align: center; padding: 20px; border-radius: 12px; letter-spacing: 2px; }
    .clock-display { font-size: 2.8rem; font-weight: bold; font-family: monospace; color: #2563eb; line-height: 1; }
    .date-display { font-size: 1.1rem; color: #0dcaf0; margin-bottom: 2px; }
    .popup-swal-custom { border-radius: 15px !important; }
    .watermark-overlay { position: absolute; bottom: 15px; right: 15px; pointer-events: none; z-index: 10; }
  </style>
</head>
<body>

  <div class="header-bar d-flex justify-content-between align-items-center">
    <div class="d-flex align-items-center">
      <i class="fas fa-school fa-2x me-3 text-primary"></i>
      <div>
        <h4 class="mb-0 fw-bold">Anjungan Presensi Murid</h4>
        <small class="text-info fw-semibold">SMK Negeri 1 Klaten</small>
      </div>
    </div>
    <div class="text-end">
      <div id="realtimeDate" class="fw-bold date-display">Memuat Tanggal...</div>
      <div id="realtimeClock" class="clock-display text-white">00:00:00</div>
    </div>
  </div>

  <div class="container-fluid flex-grow-1 d-flex align-items-center justify-content-center p-4">
    <div class="row w-100 max-w-1200">
      
      <!-- Kamera -->
      <div class="col-md-6 d-flex flex-column align-items-center justify-content-center">
        <div class="camera-box w-100">
          <video id="videoElement" autoplay playsinline></video>
          <canvas id="faceOverlay"></canvas>
          <div class="watermark-overlay">
             <div class="d-flex align-items-center bg-dark bg-opacity-50 p-2 rounded-3 border border-secondary">
                 <div class="me-2 text-info"><i class="fas fa-map-marked-alt fa-2x"></i></div>
                 <div class="text-start text-white" style="font-size: 0.75rem; text-shadow: 1px 1px 2px black;">
                     <div id="wmDate" class="fw-bold"></div>
                     <div id="wmTime" class="fw-bold text-warning" style="font-size: 0.9rem;"></div>
                     <div>Lat: -7.708815, Long: 110.598514</div>
                     <div>SMK Negeri 1 Klaten</div>
                 </div>
             </div>
          </div>
        </div>
        <canvas id="canvasElement" style="display:none;"></canvas>
      </div>

      <!-- Input Data -->
      <div class="col-md-6 d-flex flex-column align-items-center justify-content-center">
        <div class="card border-0 shadow-lg p-5 w-100" style="border-radius: 20px;">
          <h2 class="fw-bold text-center mb-4">Silakan Scan Kartu<br>atau Ketik NIS</h2>
          <input type="number" class="form-control input-barcode bg-light mb-4" id="nisInput" placeholder="S C A N  H E R E" autofocus>
          <div class="alert alert-info text-center rounded-3">
            <i class="fas fa-info-circle me-2"></i>Tekan <b>ENTER</b> setelah memasukkan NIS.
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Konfigurasi
    const API_URL = "https://script.google.com/macros/s/AKfycbze2eCy8nkeDYQC118pmDtqUdm5L3RhJ33rX6qBvHbA-plui2k50AtXJZYxJiMcnlb2/exec"; // Ganti dengan URL eksekusi Anda
    
    const video = document.getElementById('videoElement');
    const canvas = document.getElementById('canvasElement');
    const faceOverlay = document.getElementById('faceOverlay');
    const faceCtx = faceOverlay.getContext('2d');
    const nisInput = document.getElementById('nisInput');
    let isProcessing = false;
    let isSyncing = false; // Mencegah bentrok sinkronisasi ganda

    // 1. INISIALISASI DATABASE LOKAL (IndexedDB)
    let db;
    const request = indexedDB.open("PresensiLokalDB", 1);
    request.onupgradeneeded = function(event) {
        db = event.target.result;
        const objectStore = db.createObjectStore("scans", { keyPath: "id", autoIncrement: true });
        objectStore.createIndex("status", "status", { unique: false });
    };
    request.onsuccess = function(event) { db = event.target.result; updateBadgeAntrean(); };
    request.onerror = function(event) { console.error("Database error: " + event.target.errorCode); };

    // Kamera & Face API (Tetap Sama)
    navigator.mediaDevices.getUserMedia({ video: true }).then(stream => { video.srcObject = stream; }).catch(err => { Swal.fire('Error Kamera', 'Tidak dapat mengakses Webcam.', 'error'); });
    faceapi.nets.tinyFaceDetector.loadFromUri('https://raw.githubusercontent.com/justadudewhohacks/face-api.js/master/weights').then(() => {
        setInterval(async () => {
          if(video.paused || video.ended || !video.videoWidth) return;
          const detections = await faceapi.detectAllFaces(video, new faceapi.TinyFaceDetectorOptions());
          faceOverlay.width = video.videoWidth; faceOverlay.height = video.videoHeight;
          faceCtx.clearRect(0, 0, faceOverlay.width, faceOverlay.height);
          if (detections.length > 0) {
            let foremostFace = detections[0]; let maxArea = 0;
            detections.forEach(det => { const area = det.box.width * det.box.height; if(area > maxArea) { maxArea = area; foremostFace = det; } });
            faceCtx.beginPath(); faceCtx.rect(foremostFace.box.x, foremostFace.box.y, foremostFace.box.width, foremostFace.box.height);
            faceCtx.lineWidth = 4; faceCtx.strokeStyle = '#00FF00'; faceCtx.stroke();
          }
        }, 300); 
    }).catch(err => console.log("Modul wajah gagal", err));

    // Jam Real-time
    setInterval(() => {
      const d = new Date();
      document.getElementById('realtimeDate').innerText = d.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
      document.getElementById('realtimeClock').innerText = d.toLocaleTimeString('id-ID', { hour12: false });
      
      // AUTO SINKRONISASI PUKUL 07:17 KE ATAS
      if (!isSyncing && d.getHours() >= 7) {
         if (d.getHours() > 7 || (d.getHours() === 7 && d.getMinutes() >= 17)) {
             mulaiSinkronisasiKeServer();
         }
      }
    }, 1000);

    document.addEventListener('click', () => { if(!isProcessing) nisInput.focus(); });

    // 2. PROSES SCAN (SIMPAN KE LOKAL TANPA LOADING INTERNET)
    nisInput.addEventListener('keyup', function(e) {
      if (e.key === 'Enter') {
        const nis = this.value.trim();
        if (!nis || isProcessing) return;
        isProcessing = true; this.disabled = true;
        
        // Ambil Foto
        canvas.width = video.videoWidth; canvas.height = video.videoHeight;
        const ctx = canvas.getContext('2d');
        ctx.translate(canvas.width, 0); ctx.scale(-1, 1);
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        const photoDataUrl = canvas.toDataURL('image/jpeg', 0.6); // Kompresi 60% agar hemat DB

        const dNow = new Date();
        const tglStr = Utilities_formatDate(dNow); // "dd/MM/yyyy"
        const jamStr = dNow.toLocaleTimeString('id-ID', { hour12: false }); // "HH:mm:ss"

        // Simpan Ke IndexedDB Lokal
        const transaction = db.transaction(["scans"], "readwrite");
        const store = transaction.objectStore("scans");
        const dataScan = { nis: nis, tanggal: tglStr, waktu: jamStr, foto: photoDataUrl, status: "pending" };
        
        store.add(dataScan);

        transaction.oncomplete = function() {
            // Notifikasi instan tanpa nunggu server
            Swal.fire({
              icon: 'success', title: 'Tersimpan Lokal',
              html: `<h4 class="fw-bold">${nis}</h4>Tercatat: ${jamStr} WIB<br><small class="text-muted">Akan disinkronisasi pukul 07:17</small>`,
              timer: 2000, showConfirmButton: false
            });
            isProcessing = false; nisInput.disabled = false; nisInput.value = ''; nisInput.focus();
            updateBadgeAntrean();
        };
      }
    });

    // 3. FUNGSI SINKRONISASI ANTREAN (BERJALAN DI LATAR BELAKANG)
    function mulaiSinkronisasiKeServer() {
        if (!db || isSyncing) return;
        const transaction = db.transaction(["scans"], "readonly");
        const store = transaction.objectStore("scans");
        const index = store.index("status");
        const request = index.getAll("pending"); // Ambil semua yang belum dikirim

        request.onsuccess = function() {
            const dataBelumTerkirim = request.result;
            if (dataBelumTerkirim.length > 0) {
                isSyncing = true;
                console.log(`Memulai sinkronisasi ${dataBelumTerkirim.length} data...`);
                kirimDataSatuPerSatu(dataBelumTerkirim, 0);
            }
        };
    }

    // Mengirim satu per satu agar Google Spreadsheet tidak error (Queueing)
    function kirimDataSatuPerSatu(dataArray, currentIndex) {
        if (currentIndex >= dataArray.length) {
            isSyncing = false;
            updateBadgeAntrean();
            console.log("Sinkronisasi Selesai.");
            return;
        }

        const dataKirim = dataArray[currentIndex];
        
        fetch(API_URL, {
            redirect: "follow",
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({ 
                action: "prosesScanHadir", 
                nis: dataKirim.nis,
                waktu: dataKirim.waktu, // Server akan pakai jam ini, bukan jam server!
                tanggal: dataKirim.tanggal,
                foto: dataKirim.foto 
            })
        })
        .then(response => response.json())
        .then(res => {
            // Jika sukses, ubah status di lokal menjadi 'synced' atau hapus
            const tx = db.transaction(["scans"], "readwrite");
            tx.objectStore("scans").delete(dataKirim.id); // Hapus dari lokal agar memori bersih
            
            tx.oncomplete = () => {
                updateBadgeAntrean();
                // Jeda 2 detik sebelum kirim data berikutnya agar Spreadsheet aman
                setTimeout(() => kirimDataSatuPerSatu(dataArray, currentIndex + 1), 2000); 
            };
        })
        .catch(err => {
            console.error("Gagal sinkronisasi data ID " + dataKirim.id, err);
            isSyncing = false; // Berhenti jika internet putus, akan dicoba lagi nanti
        });
    }

    // Fungsi utilitas format tanggal dd/MM/yyyy
    function Utilities_formatDate(dateObj) {
        return `${String(dateObj.getDate()).padStart(2, '0')}/${String(dateObj.getMonth() + 1).padStart(2, '0')}/${dateObj.getFullYear()}`;
    }

    // Tambahan: Menampilkan sisa antrean (Anda bisa tambahkan <div id="badgeAntrean"></div> di UI HTML Anda)
    function updateBadgeAntrean() {
        if(!db) return;
        const tx = db.transaction(["scans"], "readonly");
        const countReq = tx.objectStore("scans").index("status").count("pending");
        countReq.onsuccess = function() {
            console.log("Sisa antrean di lokal: " + countReq.result);
            // document.getElementById('badgeAntrean').innerText = countReq.result + " Data Menunggu";
        }
    }
  </script>
</body>
</html>
